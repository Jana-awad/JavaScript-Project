<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />

    <script src="script.js" defer></script>
  </head>
  <body>
    <nav class="navbar">
      <i class="fa-solid fa-cart-shopping"></i>
      <p>Fresh Mart POS</p>
    </nav>
    <div class="right"></div>
    <div class="left">
      <div class="card">
        <img src="apple.jpg" alt="apple item" width="70px" />
        <h3>Apples(1 kg)</h1>
        <p id="type">Produce</p>
        <p id="price">3.5$</p>
      </div>
        <div class="card">
        <img src="banana.jpg" alt="banana item" width="70px" />
        <h3>Bananas</h1>
        <p id="type">Produce</p>
        <p id="price">2.20$</p>
      </div>
        <div class="card">
        <img src="apple.jpg" alt="apple item" width="70px" />
        <h3>Milk(1 L)</h1>
        <p id="type">Dairy</p>
        <p id="price">1.8$</p>
      </div>
        <div class="card">
        <img src="apple.jpg" alt="apple item" width="70px" />
        <h3>Bread</h1>
        <p id="type">Bakery</p>
        <p id="price">2.5$</p>
      </div>
        <div class="card">
        <img src="apple.jpg" alt="apple item" width="70px" />
        <h3>Cheese</h1>
        <p id="type">Diary</p>
        <p id="price">6.9$</p>
      </div>
        <div class="card">
        <img src="apple.jpg" alt="apple item" width="70px" />
        <h3>Croissant</h1>
        <p id="type">Bakery</p>
        <p id="price">1.6$</p>
      </div>
    <div class="main-container">
        <div class="left"></div>
        <div class="right">
          <h2>Current Order</h2>

          <ul class="purchase-list">
            <li class="purchase-item">
              <div class="item-info">
                <p class="item-name">Croissant</p>
                <p class="item-price">$1.60 each</p>
              </div>
              <div class="item-qty">
                <button><i class="fa-solid fa-minus"></i></button>
                <span>1</span>
                <button><i class="fa-solid fa-plus"></i></button>
              </div>
              <p class="item-total">$1.60</p>
              <button class="remove-btn"><i class="fa-regular fa-trash-can"></i></button>
            </li>
          </ul>

          <div class="summary">
            <div class="summary-row">
              <span>Items</span>
              <span id="items-count">1</span>
            </div>
            <div class="summary-row">
              <span>Subtotal</span>
              <span id="subtotal">$1.60</span>
            </div>
            <div class="summary-row total">
              <span>Total</span>
              <span id="total">$1.60</span>
            </div>
          </div>

          <div class="order-actions">
            <button class="clear-btn">Clear Order</button>
            <button class="checkout-btn">Complete Sale</button>
          </div>
        </div>
    </div>
  </body>
</html>
