<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />

    <script src="script.js" defer></script>
  </head>
  <body>
    <nav class="navbar">
      <i class="fa-solid fa-cart-shopping"></i>
      <p>Fresh Mart POS</p>
    </nav>
    <div class="right"></div>
    <div class="left">
      <div class="card">
        <img src="apple.jpg" alt="apple item" width="70px" />
        <h3>Apples(1 kg)</h1>
        <p id="type">Produce</p>
        <p id="price">3.5$</p>
      </div>
        <div class="card">
        <img src="banana.jpg" alt="banana item" width="70px" />
        <h3>Bananas</h1>
        <p id="type">Produce</p>
        <p id="price">2.20$</p>
      </div>
        <div class="card">
        <img src="apple.jpg" alt="apple item" width="70px" />
        <h3>Milk(1 L)</h1>
        <p id="type">Dairy</p>
        <p id="price">1.8$</p>
      </div>
        <div class="card">
        <img src="apple.jpg" alt="apple item" width="70px" />
        <h3>Bread</h1>
        <p id="type">Bakery</p>
        <p id="price">2.5$</p>
      </div>
        <div class="card">
        <img src="apple.jpg" alt="apple item" width="70px" />
        <h3>Cheese</h1>
        <p id="type">Diary</p>
        <p id="price">6.9$</p>
      </div>
        <div class="card">
        <img src="apple.jpg" alt="apple item" width="70px" />
        <h3>Croissant</h1>
        <p id="type">Bakery</p>
        <p id="price">1.6$</p>
      </div>
    </div>
  </body>
</html>
