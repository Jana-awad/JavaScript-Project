<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />

    <script type="module" src="script.js"></script>
  </head>
  <body>
    <nav class="navbar">
      <i class="fa-solid fa-cart-shopping"></i>
      <p>Fresh Mart POS</p>
    </nav>
    <div class="main-container">
        <div class="left"></div>
        <div class="right">
          <h2>Current Order</h2>
          
          <ul class="purchase-list"></ul>

          <div class="summary">
            <div class="summary-row">
              <span>Items</span>
              <span id="items-count">4</span>
            </div>
            <div class="summary-row">
              <span>Subtotal</span>
              <span id="subtotal">$7.40</span>
            </div>
            <div class="summary-row total">
              <span>Total</span>
              <span id="total">$7.40</span>
            </div>
          </div>

          <input type="number" class="amount-paid" placeholder="Amount paid" />

          <div class="order-actions">
            <button class="clear-btn">Clear Order</button>
            <button class="checkout-btn">Complete Sale</button>
          </div>
        </div>
    </div>
  </body>
</html>
